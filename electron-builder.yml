appId: app.leaguesense
productName: LeagueSense
copyright: LeagueSense
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
compression: normal
extraMetadata:
  main: out/main/index.js
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: LeagueSense-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LeagueSense
  language: "1046"
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  deleteAppDataOnUninstall: false
portable:
  artifactName: LeagueSense-${version}-portable.${ext}
